<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Pastel Imut</title>
    <style>
      body {
        background-color: #fdf6f0; /* Latar belakang krem sangat muda */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .calculator {
        background-color: #ffffff;
        padding: 25px;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        width: 300px;
        border: 5px solid #fce4ec; /* Border pink pastel tipis */
      }

      #display {
        width: 100%;
        height: 60px;
        background-color: #f7f1e3;
        border: none;
        border-radius: 15px;
        margin-bottom: 20px;
        text-align: right;
        padding: 0 15px;
        font-size: 2rem;
        color: #7d7362;
        box-sizing: border-box;
        font-weight: bold;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        padding: 20px 10px;
        font-size: 1.2rem;
        font-weight: 600;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        transition: all 0.2s ease;
        color: #6d6d6d;
      }

      button:hover {
        transform: translateY(-3px);
        filter: brightness(1.05);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
      }

      button:active {
        transform: translateY(0);
      }

      /* Klasifikasi Warna Pastel */
      .num {
        background-color: #e1f5fe;
      } /* Biru muda */
      .op {
        background-color: #fff9c4;
        color: #b3a400;
      } /* Kuning pastel */
      .clear {
        background-color: #ffcdd2;
        color: #d32f2f;
        grid-column: span 2;
      } /* Merah muda */
      .equals {
        background-color: #c8e6c9;
        color: #388e3c;
        grid-column: span 2;
      } /* Hijau pastel */

      /* Tombol khusus 0 */
      button[data-val="0"] {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input type="text" id="display" value="0" disabled />

      <div class="buttons" id="btn-container">
        <button class="clear" data-type="clear">C</button>
        <button class="op" data-type="operator" data-val="/">÷</button>
        <button class="op" data-type="operator" data-val="*">×</button>

        <button class="num" data-type="number" data-val="7">7</button>
        <button class="num" data-type="number" data-val="8">8</button>
        <button class="num" data-type="number" data-val="9">9</button>
        <button class="op" data-type="operator" data-val="-">-</button>

        <button class="num" data-type="number" data-val="4">4</button>
        <button class="num" data-type="number" data-val="5">5</button>
        <button class="num" data-type="number" data-val="6">6</button>
        <button class="op" data-type="operator" data-val="+">+</button>

        <button class="num" data-type="number" data-val="1">1</button>
        <button class="num" data-type="number" data-val="2">2</button>
        <button class="num" data-type="number" data-val="3">3</button>
        <button class="equals" data-type="equals">=</button>

        <button class="num" data-type="number" data-val="0">0</button>
        <button class="num" data-type="number" data-val=".">.</button>
      </div>
    </div>

    <script src="latihan-1.js"></script>
  </body>
</html>
