<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2 - Komponen Interaktif</title>
    <link rel="stylesheet" href="latihan-2.css">
</head>
<body>

    <div class="container">
        <section class="section">
            <h2>1. FAQ Accordion</h2>
            <div class="faq-container">
                <details class="faq-item">
                    <summary>Apa itu CSS Grid?</summary>
                    <p>CSS Grid adalah sistem tata letak dua dimensi untuk web.</p>
                </details>
                <details class="faq-item">
                    <summary>Bagaimana cara kerja pseudo-element?</summary>
                    <p>Pseudo-element memungkinkan Anda memberi gaya pada bagian tertentu dari elemen.</p>
                </details>
            </div>
        </section>

        <section class="section">
            <h2>2. Image Hover Overlay</h2>
            <div class="image-grid">
                <div class="image-item" data-title="Pemandangan 1">
                    <img src="https://picsum.photos/300/200?random=1" alt="Random 1">
                </div>
                <div class="image-item" data-title="Pemandangan 2">
                    <img src="https://picsum.photos/300/200?random=2" alt="Random 2">
                </div>
                <div class="image-item" data-title="Pemandangan 3">
                    <img src="https://picsum.photos/300/200?random=3" alt="Random 3">
                </div>
                <div class="image-item" data-title="Pemandangan 4">
                    <img src="https://picsum.photos/300/200?random=4" alt="Random 4">
                </div>
            </div>
        </section>

        <section class="section">
            <h2>3. Progress Bars</h2>
            <div class="progress-container">
                <div class="progress-bar" style="--progress: 45%;"></div>
                <div class="progress-bar" style="--progress: 75%;"></div>
                <div class="progress-bar" style="--progress: 90%;"></div>
            </div>
        </section>
    </div>

</body>
</html>
